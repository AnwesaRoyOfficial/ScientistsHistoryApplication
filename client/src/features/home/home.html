<div class="hero bg-base-200 min-h-screen">
    @if (!registerMode())
    {
        <div class="hero-content text-center">
            <div class = "flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-60 text-primary">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 21v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21m0 0h4.5V3.545M12.75 21h7.5V10.75M2.25 21h1.5m18 0h-18M2.25 9l4.5-1.636M18.75 3l-1.5.545m0 6.205 3 1m1.5.5-1.5-.5M6.75 7.364V3h-3v18m3-13.636 10.5-3.819" />
                </svg>
                <h1 class = "text-5xl font-bold">Find your more about your favourite scientists</h1>
                <p class = "py-6">Come on in... all you need to do is sign up</p>
                <div class = "flex items-center gap-3">
                    <button (click)="showRegister(true)" class= "btn btn-primary btn-lg">Register</button>
                    <button class = "btn btn-info btn-lg">Learn more</button>
                </div>
            </div>
        </div>
    }
    @else
    {
        <div class = "w-full text-2xl text-center flex justify-center">
            <app-register
            class = "w-full"
                (cancelRegister)="showRegister($event)"            
            />
        </div>
    }
    
</div>
